<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WORKSPACE Tracker - Project Timeline</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .tab-active { color: #2563eb; border-bottom: 3px solid #2563eb; }
        .card { background: white; border-radius: 1.5rem; border: 1px solid #e2e8f0; }
        #toast { transition: opacity 0.3s; pointer-events: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .btn-primary { background-color: #0f172a; color: white; transition: all 0.2s; }
        .btn-primary:active { transform: scale(0.95); }
        .modal-overlay { background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); }
        .input-disabled { background-color: #f1f5f9; color: #94a3b8; cursor: not-allowed; }
        .user-pill { background-color: #eff6ff; border: 1px solid #dbeafe; color: #2563eb; }
        .page-btn { padding: 0.5rem 1rem; border-radius: 0.75rem; background: white; border: 1px solid #e2e8f0; font-size: 0.75rem; font-weight: 700; color: #64748b; transition: all 0.2s; }
        .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .page-btn:not(:disabled):hover { border-color: #2563eb; color: #2563eb; }
    </style>
</head>
<body class="pb-10">

    <!-- HALAMAN LOGIN -->
    <div id="loginPage" class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-white w-full max-w-md p-10 rounded-[2.5rem] shadow-2xl border-none text-center border border-slate-100">
            <h1 class="text-3xl font-extrabold text-slate-900 mb-1 tracking-tighter italic uppercase">WORKSPACE</h1>
            <p class="text-slate-400 text-[10px] mb-8 font-bold tracking-[0.3em] uppercase">Firebase Managed System</p>
            
            <form id="loginForm" class="space-y-4 text-left">
                <input type="text" id="u" placeholder="Username" required class="w-full p-4 border rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50 text-sm">
                <input type="password" id="p" placeholder="Password" required class="w-full p-4 border rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50 text-sm">
                <button type="submit" id="btnLogin" class="w-full btn-primary font-bold py-4 rounded-2xl shadow-lg uppercase tracking-widest text-xs">Masuk Sekarang</button>
            </form>
            <p id="statusDB" class="mt-6 text-[9px] text-slate-400 uppercase font-bold tracking-widest italic">Menghubungkan Database...</p>
        </div>
    </div>

    <!-- APLIKASI UTAMA -->
    <div id="mainApp" class="hidden max-w-2xl mx-auto">
        <header class="p-6 bg-white/80 backdrop-blur border-b flex justify-between items-center sticky top-0 z-50 shadow-sm">
            <div>
                <h2 id="uDisp" class="font-bold text-slate-800 text-lg uppercase tracking-tight italic text-blue-600">User</h2>
                <span id="rDisp" class="text-[9px] bg-slate-900 text-white px-2 py-0.5 rounded-full font-bold uppercase tracking-widest">Role</span>
            </div>
            <button onclick="location.reload()" class="text-[10px] font-bold text-red-500 bg-red-50 px-4 py-2 rounded-full border border-red-100 uppercase">Logout</button>
        </header>

        <nav class="flex bg-white border-b sticky top-[77px] z-40 overflow-x-auto no-scrollbar">
            <button onclick="tab('input')" id="t_input" class="flex-1 py-4 text-[11px] font-bold tab-active uppercase tracking-widest">Input</button>
            <button onclick="tab('logs')" id="t_logs" class="flex-1 py-4 text-[11px] font-bold text-slate-400 uppercase tracking-widest">Pantauan</button>
            <button onclick="tab('settings')" id="t_settings" class="hidden flex-1 py-4 text-[11px] font-bold text-slate-400 uppercase tracking-widest">Settings</button>
        </nav>

        <main class="p-4 space-y-6">
            <!-- VIEW: INPUT PROGRES -->
            <section id="v_input" class="space-y-4">
                <div class="card p-6 shadow-sm border-blue-50">
                    <form id="progressForm" class="space-y-4">
                        <label class="text-[9px] font-bold text-slate-400 uppercase ml-1 tracking-wider">Tanggal Kerja</label>
                        <input type="date" id="f_date" required class="w-full p-3 border rounded-xl bg-slate-50 outline-none text-sm font-semibold">
                        <label class="text-[9px] font-bold text-slate-400 uppercase ml-1 tracking-wider">Pilih Projek</label>
                        <select id="f_proj" required class="w-full p-3 border rounded-xl bg-white font-bold text-slate-700 text-sm outline-none border-slate-200"></select>
                        <label class="text-[9px] font-bold text-slate-400 uppercase ml-1 tracking-wider">Detail Pekerjaan (Progres)</label>
                        <textarea id="f_work" rows="5" placeholder="Tuliskan apa yang kamu kerjakan hari ini..." required class="w-full p-3 border rounded-xl bg-slate-50 outline-none text-sm leading-relaxed"></textarea>
                        <button type="submit" id="btnSubmitLog" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl shadow-lg uppercase text-[10px] tracking-widest active:scale-95 transition-all">Simpan Progres</button>
                    </form>
                </div>
            </section>

            <!-- VIEW: PANTAUAN LOGS -->
            <section id="v_logs" class="hidden space-y-4">
                <div class="card p-4 space-y-3 sticky top-[140px] z-30 shadow-xl border-slate-200">
                    <div class="flex gap-2">
                        <select id="flUser" onchange="renderLogs()" class="flex-1 p-3 border rounded-xl text-[11px] font-bold bg-slate-50 outline-none border-slate-200"></select>
                        <select id="flProj" onchange="renderLogs()" class="flex-1 p-3 border rounded-xl text-[11px] font-bold bg-slate-50 outline-none border-slate-200"></select>
                    </div>
                </div>
                <div id="logList" class="space-y-3 pt-2"></div>
            </section>

            <!-- VIEW: SETTINGS (ADMIN ONLY) -->
            <section id="v_settings" class="hidden space-y-8">
                <!-- Manajemen Akun -->
                <div class="card p-6 shadow-sm bg-slate-50/50 border-slate-100">
                    <h3 class="text-xs font-bold text-slate-800 uppercase mb-4 tracking-widest flex items-center gap-2">
                        <span class="w-2 h-2 bg-blue-600 rounded-full"></span> Manajemen Akun
                    </h3>
                    <div class="space-y-4 mb-8">
                        <div class="grid grid-cols-2 gap-2">
                            <input type="text" id="mU" placeholder="Username" class="p-3 border rounded-xl text-sm outline-none bg-white">
                            <input type="text" id="mP" placeholder="Password" class="p-3 border rounded-xl text-sm outline-none bg-white">
                        </div>
                        <select id="mR" class="w-full p-3 border rounded-xl text-sm outline-none">
                            <option value="USER">TIM (USER)</option>
                            <option value="ADMIN">ADMINISTRATOR</option>
                        </select>
                        
                        <div class="flex gap-2">
                            <button id="btnCancelEdit" onclick="resetUserForm()" class="hidden flex-1 bg-slate-200 text-slate-600 font-bold py-3 rounded-xl text-[10px] uppercase tracking-widest">Batal</button>
                            <button id="btnSaveUser" onclick="saveUser()" class="flex-[2] bg-slate-900 text-white font-bold py-3 rounded-xl text-[10px] uppercase tracking-widest">Simpan Akun</button>
                        </div>
                    </div>
                    
                    <div class="space-y-2 mb-4" id="userListSettings"></div>
                    <div id="userPagination" class="flex justify-between items-center px-1">
                        <!-- Pagination Akun -->
                    </div>
                </div>

                <!-- Manajemen Projek -->
                <div class="card p-6 shadow-sm border-slate-100">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-xs font-bold text-slate-800 uppercase tracking-widest flex items-center gap-2">
                            <span class="w-2 h-2 bg-green-600 rounded-full"></span> Daftar Projek Global
                        </h3>
                    </div>
                    
                    <!-- Form Tambah & Search -->
                    <div class="space-y-3 mb-6">
                        <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-3">
                            <p id="projFormTitle" class="text-[9px] font-extrabold text-slate-400 uppercase tracking-widest">Tambah Projek Baru</p>
                            <input type="text" id="nP" placeholder="NAMA PROJEK BARU..." class="w-full p-3 border rounded-xl text-sm outline-none bg-white uppercase font-bold border-slate-200">
                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <label class="text-[8px] font-bold text-slate-400 uppercase ml-1">Mulai</label>
                                    <input type="date" id="nPStart" class="w-full p-2.5 border rounded-xl text-xs bg-white outline-none">
                                </div>
                                <div>
                                    <label class="text-[8px] font-bold text-slate-400 uppercase ml-1">Deadline</label>
                                    <input type="date" id="nPEnd" class="w-full p-2.5 border rounded-xl text-xs bg-white outline-none">
                                </div>
                            </div>
                            <div class="flex gap-2">
                                <button id="btnCancelEditProj" onclick="resetProjectForm()" class="hidden flex-1 bg-slate-200 text-slate-600 font-bold py-3 rounded-xl text-[10px] uppercase tracking-widest">Batal</button>
                                <button id="btnAddNewProject" onclick="addNewProject()" class="flex-[2] bg-blue-600 text-white py-3 rounded-xl font-bold active:scale-95 text-xs uppercase tracking-widest shadow-lg shadow-blue-100">+ Tambahkan Projek</button>
                            </div>
                        </div>

                        <div class="relative">
                            <input type="text" id="searchProj" oninput="handleProjSearch()" placeholder="Cari nama projek..." class="w-full p-3 pl-10 border rounded-xl text-xs outline-none bg-white border-slate-200 shadow-sm">
                            <svg class="w-4 h-4 absolute left-3.5 top-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        </div>
                    </div>

                    <div id="projListSettings" class="space-y-5 mb-4">
                        <!-- Daftar Projek dengan dropdown tim akan muncul di sini -->
                    </div>
                    
                    <div id="projPagination" class="flex justify-between items-center px-1">
                        <!-- Pagination Projek -->
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- MODAL EDIT LOG -->
    <div id="modalEdit" class="hidden fixed inset-0 z-[100] modal-overlay flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md p-6 rounded-3xl shadow-2xl">
            <h3 class="text-xs font-bold text-slate-800 uppercase mb-4 tracking-widest">Edit Progres</h3>
            <div class="space-y-4">
                <input type="hidden" id="editLogId">
                <textarea id="editLogWork" rows="5" class="w-full p-4 border rounded-2xl bg-slate-50 outline-none text-sm"></textarea>
                <div class="flex gap-2">
                    <button onclick="closeEditModal()" class="flex-1 py-3 bg-slate-100 text-slate-500 rounded-xl font-bold text-xs uppercase">Batal</button>
                    <button onclick="confirmEditLog()" class="flex-1 py-3 bg-blue-600 text-white rounded-xl font-bold text-xs uppercase shadow-lg">Simpan Perubahan</button>
                </div>
            </div>
        </div>
    </div>

    <!-- TOAST NOTIFIKASI -->
    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-8 py-4 rounded-2xl shadow-2xl opacity-0 z-[100] text-[10px] font-bold uppercase tracking-widest text-center"></div>

    <!-- FIREBASE SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, collection, onSnapshot, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD-wrKOTP046d3Ojr_pKPHEWWf7Kuk5Nco",
            authDomain: "workspace-tracker-b3f8a.firebaseapp.com",
            projectId: "workspace-tracker-b3f8a",
            storageBucket: "workspace-tracker-b3f8a.firebasestorage.app",
            messagingSenderId: "347113310211",
            appId: "1:347113310211:web:900680ab7b8456a0f66636",
            measurementId: "G-46YN28RC22"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "workspace-tracker-final-v2";

        let currentUser = null;
        let logsData = [];
        let usersData = [];
        let projectsData = [];
        let isEditingUser = false;
        let isEditingProject = false;
        let editingProjectOldName = "";

        // Pagination State
        let usersCurrentPage = 1;
        const usersPerPage = 5;
        let projsCurrentPage = 1;
        const projsPerPage = 3;
        let projSearchQuery = "";

        // 1. Initial Connection
        const init = async () => {
            try {
                await signInAnonymously(auth);
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        document.getElementById('statusDB').innerText = "✅ Cloud Connected";
                        document.getElementById('statusDB').classList.replace('text-slate-400', 'text-green-600');
                    }
                });
            } catch (e) {
                document.getElementById('statusDB').innerText = "⚠️ Connection Error";
                document.getElementById('statusDB').classList.replace('text-slate-400', 'text-red-600');
            }
        };
        init();

        // 2. Sistem Login
        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnLogin');
            btn.disabled = true; btn.innerText = "MENGECEK...";
            
            const u = document.getElementById('u').value.trim().toLowerCase();
            const p = document.getElementById('p').value.trim();
            
            const userRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', u);
            const userSnap = await getDoc(userRef);

            if (userSnap.exists() && userSnap.data().password === p) {
                currentUser = { username: u, ...userSnap.data() };
                startApp();
            } else if (u === 'admin' && p === 'admin123') {
                currentUser = { username: 'admin', role: 'ADMIN' };
                await setDoc(userRef, { password: 'admin123', role: 'ADMIN' });
                startApp();
            } else {
                msg("❌ USERNAME/PASSWORD SALAH");
                btn.disabled = false; btn.innerText = "MASUK SEKARANG";
            }
        };

        async function startApp() {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            document.getElementById('uDisp').innerText = currentUser.username.toUpperCase();
            document.getElementById('rDisp').innerText = currentUser.role;
            document.getElementById('f_date').valueAsDate = new Date();

            if (currentUser.role === 'ADMIN') {
                document.getElementById('t_settings').classList.remove('hidden');
            } else {
                document.getElementById('flUser').classList.add('hidden');
            }

            listenUsers();
            listenProjects();
            listenLogs();

            tab('input');
        }

        // --- LISTENERS ---

        function listenProjects() {
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'projects'), (snap) => {
                projectsData = snap.docs.map(d => ({ name: d.id, ...d.data() }));
                renderProjectList();
                renderInputDropdowns();
            });
        }

        function renderInputDropdowns() {
            const fP = document.getElementById('f_proj');
            const flP = document.getElementById('flProj');
            
            const currentFpVal = fP.value;
            const currentFlpVal = flP.value;

            fP.innerHTML = '<option value="" disabled selected>-- Pilih Projek --</option>';
            flP.innerHTML = '<option value="ALL">SEMUA PROJEK</option>';

            projectsData.sort((a,b) => a.name.localeCompare(b.name)).forEach(proj => {
                const assignedUsers = proj.assignedUsers || [];
                const isAssigned = currentUser.role === 'ADMIN' || assignedUsers.includes(currentUser.username);
                
                if (isAssigned) {
                    fP.add(new Option(proj.name, proj.name));
                    flP.add(new Option(proj.name, proj.name));
                }
            });

            if(currentFpVal) fP.value = currentFpVal;
            if(currentFlpVal) flP.value = currentFlpVal;
        }

        window.renderProjectList = () => {
            const listSet = document.getElementById('projListSettings');
            const pagSet = document.getElementById('projPagination');
            if(!listSet) return;

            // Filter
            const filtered = projectsData.filter(p => p.name.includes(projSearchQuery.toUpperCase())).sort((a,b) => a.name.localeCompare(b.name));
            
            // Pagination
            const totalPages = Math.ceil(filtered.length / projsPerPage) || 1;
            if (projsCurrentPage > totalPages) projsCurrentPage = totalPages;
            
            const startIndex = (projsCurrentPage - 1) * projsPerPage;
            const paginated = filtered.slice(startIndex, startIndex + projsPerPage);

            listSet.innerHTML = '';
            paginated.forEach(proj => {
                const assignedUsers = proj.assignedUsers || [];
                
                let assignedPills = '';
                assignedUsers.sort().forEach(uid => {
                    assignedPills += `
                        <div class="user-pill flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl text-[10px] font-bold uppercase shadow-sm">
                            <span>${uid}</span>
                            <button onclick="toggleUserAssignment('${proj.name}', '${uid}', false)" class="hover:text-red-500 ml-0.5">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
                            </button>
                        </div>
                    `;
                });

                const availableUsers = usersData.filter(u => !assignedUsers.includes(u.id)).sort((a,b) => a.id.localeCompare(b.id));
                let userOptions = '<option value="" disabled selected>Pilih Anggota Tim...</option>';
                availableUsers.forEach(u => userOptions += `<option value="${u.id}">${u.id.toUpperCase()}</option>`);

                // Format Tanggal untuk Tampilan
                const startDateStr = proj.startDate ? new Date(proj.startDate).toLocaleDateString('id-ID', {day:'2-digit', month:'short', year:'numeric'}) : '-';
                const endDateStr = proj.endDate ? new Date(proj.endDate).toLocaleDateString('id-ID', {day:'2-digit', month:'short', year:'numeric'}) : '-';

                listSet.innerHTML += `
                    <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                        <div class="flex justify-between items-start">
                            <div class="space-y-1">
                                <span class="text-xs font-extrabold uppercase text-slate-800 tracking-tight flex items-center gap-2">
                                    <span class="w-1.5 h-1.5 bg-blue-600 rounded-full"></span> ${proj.name}
                                </span>
                                <div class="flex items-center gap-2 text-[10px] text-slate-400 font-bold uppercase">
                                    <span>${startDateStr}</span>
                                    <span>&rarr;</span>
                                    <span class="${proj.endDate ? 'text-red-500' : ''}">${endDateStr}</span>
                                </div>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="editProjectPrompt('${proj.name}', '${proj.startDate}', '${proj.endDate}')" class="text-blue-500 hover:text-blue-700 text-[9px] font-bold uppercase">
                                    Edit
                                </button>
                                <button onclick="deleteProject('${proj.name}')" class="text-red-400 hover:text-red-600 text-[9px] font-bold uppercase">
                                    Hapus
                                </button>
                            </div>
                        </div>

                        <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                            <p class="text-[9px] font-extrabold text-slate-400 uppercase mb-2 tracking-widest">Tim Penanggung Jawab:</p>
                            <div class="flex flex-wrap gap-2 mb-4">
                                ${assignedPills || '<p class="text-[9px] italic text-slate-300 uppercase py-2">Belum ada tim ditugaskan</p>'}
                            </div>
                            
                            <div class="flex gap-2">
                                <select id="selAddUser_${proj.name.replace(/\s+/g, '_')}" class="flex-grow p-2.5 border rounded-xl text-[10px] font-bold bg-white outline-none border-slate-200 shadow-sm focus:ring-2 focus:ring-blue-500">
                                    ${userOptions}
                                </select>
                                <button onclick="addUserToProject('${proj.name}')" class="bg-blue-600 text-white px-4 rounded-xl font-bold shadow-lg shadow-blue-100 active:scale-95">+</button>
                            </div>
                        </div>
                    </div>`;
            });

            // Pagination Controls
            pagSet.innerHTML = `
                <button onclick="changeProjPage(-1)" ${projsCurrentPage === 1 ? 'disabled' : ''} class="page-btn">Sebelumnya</button>
                <span class="text-[10px] font-bold text-slate-400 uppercase">Hal ${projsCurrentPage} dari ${totalPages}</span>
                <button onclick="changeProjPage(1)" ${projsCurrentPage === totalPages ? 'disabled' : ''} class="page-btn">Selanjutnya</button>
            `;
            
            if(filtered.length === 0) {
                listSet.innerHTML = '<div class="text-center py-10 text-[10px] font-bold text-slate-400 italic">Projek tidak ditemukan</div>';
                pagSet.innerHTML = '';
            }
        };

        window.handleProjSearch = () => {
            projSearchQuery = document.getElementById('searchProj').value;
            projsCurrentPage = 1;
            renderProjectList();
        };

        window.changeProjPage = (dir) => {
            projsCurrentPage += dir;
            renderProjectList();
            document.getElementById('projListSettings').scrollIntoView({ behavior: 'smooth' });
        };

        function listenUsers() {
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'users'), (snap) => {
                usersData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderUserList();
            });
        }

        window.renderUserList = () => {
            if(currentUser.role !== 'ADMIN') return;

            const flU = document.getElementById('flUser');
            const listSet = document.getElementById('userListSettings');
            const pagSet = document.getElementById('userPagination');

            flU.innerHTML = '<option value="ALL">SEMUA TIM</option>';
            
            const sorted = usersData.sort((a,b) => a.id.localeCompare(b.id));
            const totalPages = Math.ceil(sorted.length / usersPerPage) || 1;
            if (usersCurrentPage > totalPages) usersCurrentPage = totalPages;

            const startIndex = (usersCurrentPage - 1) * usersPerPage;
            const paginated = sorted.slice(startIndex, startIndex + usersPerPage);

            listSet.innerHTML = '';
            sorted.forEach(u => flU.add(new Option(u.id.toUpperCase(), u.id))); // Dropdown filter pantauan tetap semua

            paginated.forEach(u => {
                listSet.innerHTML += `
                    <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm flex justify-between items-center">
                        <div class="flex-grow">
                            <p class="text-xs font-extrabold text-slate-800 uppercase">${u.id} <span class="text-[9px] text-blue-500 italic">(${u.role})</span></p>
                            <p class="text-[9px] text-slate-400 font-bold uppercase">Pass: ${u.password}</p>
                        </div>
                        <div class="flex gap-2 ml-2">
                            <button onclick="editUserPrompt('${u.id}', '${u.password}', '${u.role}')" class="text-[10px] font-bold text-blue-500">EDIT</button>
                            <button onclick="deleteUser('${u.id}')" class="text-[10px] font-bold text-red-500">HAPUS</button>
                        </div>
                    </div>`;
            });

            // Pagination Controls
            pagSet.innerHTML = `
                <button onclick="changeUserPage(-1)" ${usersCurrentPage === 1 ? 'disabled' : ''} class="page-btn">Sebelumnya</button>
                <span class="text-[10px] font-bold text-slate-400 uppercase">Hal ${usersCurrentPage} dari ${totalPages}</span>
                <button onclick="changeUserPage(1)" ${usersCurrentPage === totalPages ? 'disabled' : ''} class="page-btn">Selanjutnya</button>
            `;
        };

        window.changeUserPage = (dir) => {
            usersCurrentPage += dir;
            renderUserList();
        };

        function listenLogs() {
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'logs'), (snap) => {
                logsData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                logsData.sort((a, b) => new Date(b.tanggal) - new Date(a.tanggal));
                renderLogs();
            });
        }

        // --- CORE LOGIC ---

        window.renderLogs = () => {
            const list = document.getElementById('logList');
            if(!list) return;
            const fP = document.getElementById('flProj').value;
            const fU = currentUser.role === 'ADMIN' ? document.getElementById('flUser').value : 'ALL';

            const filtered = logsData.filter(l => {
                const project = projectsData.find(p => p.name === l.project_name);
                const assignedUsers = project ? (project.assignedUsers || []) : [];
                
                const isAssigned = currentUser.role === 'ADMIN' || assignedUsers.includes(currentUser.username);
                if (!isAssigned) return false;

                const matchProj = fP === 'ALL' || l.project_name === fP;
                const matchUser = fU === 'ALL' || l.username === fU;
                return matchProj && matchUser;
            });

            list.innerHTML = filtered.length ? '' : '<div class="text-center py-20 text-[10px] font-bold uppercase opacity-20 italic tracking-widest">Data Masih Kosong</div>';
            
            filtered.forEach(l => {
                const canEdit = l.username === currentUser.username || currentUser.role === 'ADMIN';
                list.innerHTML += `
                <div class="bg-white p-5 rounded-3xl shadow-sm border-l-4 border-l-slate-900 mb-3 border border-slate-100 relative">
                    <div class="flex justify-between items-start mb-2">
                        <div class="flex flex-col">
                            <span class="text-[9px] font-bold text-blue-600 bg-blue-50 px-2 py-1 rounded-md uppercase w-fit mb-1">${l.username.toUpperCase()} &bull; ${l.project_name}</span>
                            <span class="text-[9px] font-bold text-slate-400 uppercase tracking-tighter">${l.tanggal}</span>
                        </div>
                        ${canEdit ? `
                        <div class="flex gap-1">
                             <button onclick="editLogPrompt('${l.id}', \`${l.pekerjaan.replace(/'/g, "\\'")}\`)" class="p-2 text-slate-300 hover:text-blue-500"><svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" /></svg></button>
                             <button onclick="deleteLog('${l.id}')" class="p-2 text-slate-300 hover:text-red-500"><svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg></button>
                        </div>` : ''}
                    </div>
                    <p class="text-sm text-slate-700 leading-relaxed font-medium">${l.pekerjaan.replace(/\n/g, '<br>')}</p>
                </div>`;
            });
        };

        document.getElementById('progressForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmitLog');
            btn.disabled = true; btn.innerText = "MENGIRIM...";
            try {
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'logs'), {
                    tanggal: document.getElementById('f_date').value,
                    username: currentUser.username,
                    project_name: document.getElementById('f_proj').value,
                    pekerjaan: document.getElementById('f_work').value,
                    ts: serverTimestamp()
                });
                msg("✅ LAPORAN TERKIRIM");
                document.getElementById('f_work').value = '';
            } catch (err) { msg("❌ GAGAL SIMPAN"); }
            btn.disabled = false; btn.innerText = "SIMPAN PROGRES";
        };

        // --- SETTINGS ACTIONS ---

        window.saveUser = async () => {
            const uInput = document.getElementById('mU');
            const u = uInput.value.trim().toLowerCase();
            const p = document.getElementById('mP').value.trim();
            const r = document.getElementById('mR').value;

            if(!u || !p) return msg("ISI USERNAME & PASS!");
            
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', u), {
                password: p,
                role: r
            }, { merge: true });
            
            msg(isEditingUser ? "✅ DATA AKUN DIPERBARUI" : "✅ AKUN BERHASIL DISIMPAN");
            resetUserForm();
        };

        window.resetUserForm = () => {
            isEditingUser = false;
            const uInput = document.getElementById('mU');
            uInput.value = '';
            uInput.disabled = false;
            uInput.classList.remove('input-disabled');
            
            document.getElementById('mP').value = '';
            document.getElementById('mR').value = 'USER';
            
            document.getElementById('btnSaveUser').innerText = "Simpan Akun";
            document.getElementById('btnCancelEdit').classList.add('hidden');
        };

        window.editUserPrompt = (u, p, r) => {
            isEditingUser = true;
            const uInput = document.getElementById('mU');
            uInput.value = u;
            uInput.disabled = true;
            uInput.classList.add('input-disabled');
            
            document.getElementById('mP').value = p;
            document.getElementById('mR').value = r;

            document.getElementById('btnSaveUser').innerText = "Update Data Akun";
            document.getElementById('btnCancelEdit').classList.remove('hidden');
            
            document.getElementById('userListSettings').scrollIntoView({ behavior: 'smooth' });
            msg("MODE EDIT: " + u.toUpperCase());
        };

        window.deleteUser = async (u) => {
            if(u === 'admin') return msg("TIDAK BISA HAPUS ADMIN UTAMA");
            if(confirm(`Hapus akun ${u.toUpperCase()}?`)) {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', u));
                msg("AKUN DIHAPUS");
            }
        };

        window.addNewProject = async () => {
            const nameInput = document.getElementById('nP');
            const newName = nameInput.value.toUpperCase().trim();
            const start = document.getElementById('nPStart').value;
            const end = document.getElementById('nPEnd').value;

            if(!newName) return msg("NAMA PROJEK WAJIB DIISI!");
            
            if (isEditingProject) {
                const oldName = editingProjectOldName;
                
                if (newName !== oldName) {
                    // Rename logic: Pindahkan data ke ID baru, hapus ID lama
                    const proj = projectsData.find(p => p.name === oldName);
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'projects', newName), { 
                        created: true,
                        assignedUsers: proj.assignedUsers || [],
                        startDate: start,
                        endDate: end
                    });
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'projects', oldName));
                    
                    // Update riwayat pekerjaan (logs) terkait
                    const logsToUpdate = logsData.filter(l => l.project_name === oldName);
                    for (const l of logsToUpdate) {
                        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'logs', l.id), {
                            project_name: newName
                        });
                    }
                } else {
                    // Update hanya tanggal
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'projects', oldName), { 
                        startDate: start,
                        endDate: end
                    });
                }
                msg("✅ PROJEK DIPERBARUI");
            } else {
                if (projectsData.some(p => p.name === newName)) return msg("NAMA PROJEK SUDAH ADA!");
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'projects', newName), { 
                    created: true,
                    assignedUsers: [],
                    startDate: start,
                    endDate: end
                });
                msg("✅ PROJEK DITAMBAHKAN");
            }
            
            resetProjectForm();
        };

        window.resetProjectForm = () => {
            isEditingProject = false;
            editingProjectOldName = "";
            const nPInput = document.getElementById('nP');
            nPInput.value = '';
            nPInput.disabled = false;
            nPInput.classList.remove('input-disabled');
            document.getElementById('nPStart').value = '';
            document.getElementById('nPEnd').value = '';
            document.getElementById('btnAddNewProject').innerText = "+ Tambahkan Projek";
            document.getElementById('btnCancelEditProj').classList.add('hidden');
            document.getElementById('projFormTitle').innerText = "Tambah Projek Baru";
        };

        window.editProjectPrompt = (name, start, end) => {
            isEditingProject = true;
            editingProjectOldName = name;
            const nPInput = document.getElementById('nP');
            nPInput.value = name;
            nPInput.disabled = false;
            nPInput.classList.remove('input-disabled');
            document.getElementById('nPStart').value = start || '';
            document.getElementById('nPEnd').value = end || '';
            
            document.getElementById('btnAddNewProject').innerText = "Update Projek";
            document.getElementById('btnCancelEditProj').classList.remove('hidden');
            document.getElementById('projFormTitle').innerText = "Edit Projek: " + name;
            
            document.getElementById('nP').scrollIntoView({ behavior: 'smooth' });
            msg("MODE EDIT PROJEK");
        };

        window.deleteProject = async (name) => {
            if(confirm(`Hapus projek ${name}?`)) {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'projects', name));
                msg("PROJEK DIHAPUS");
            }
        };

        window.addUserToProject = async (projectName) => {
            const dropdownId = `selAddUser_${projectName.replace(/\s+/g, '_')}`;
            const sel = document.getElementById(dropdownId);
            const userId = sel.value;
            if(!userId) return msg("PILIH ANGGOTA TIM!");
            
            await toggleUserAssignment(projectName, userId, true);
        };

        window.toggleUserAssignment = async (projectName, userId, isChecked) => {
            const project = projectsData.find(p => p.name === projectName);
            if (!project) return;

            let updatedUsers = project.assignedUsers || [];
            if (isChecked) {
                if (!updatedUsers.includes(userId)) updatedUsers.push(userId);
            } else {
                updatedUsers = updatedUsers.filter(uid => uid !== userId);
            }

            try {
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'projects', projectName), {
                    assignedUsers: updatedUsers
                });
                msg(`UPDATE TIM ${projectName}`);
            } catch (err) {
                msg("❌ GAGAL UPDATE");
            }
        };

        // --- LOG ACTIONS ---
        window.deleteLog = async (id) => {
            if(confirm("Hapus laporan progres ini?")) {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'logs', id));
                msg("LAPORAN DIHAPUS");
            }
        };

        window.editLogPrompt = (id, work) => {
            document.getElementById('editLogId').value = id;
            document.getElementById('editLogWork').value = work;
            document.getElementById('modalEdit').classList.remove('hidden');
        };

        window.confirmEditLog = async () => {
            const id = document.getElementById('editLogId').value;
            const work = document.getElementById('editLogWork').value;
            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'logs', id), {
                pekerjaan: work
            });
            closeEditModal();
            msg("✅ PROGRES DIPERBARUI");
        };

        window.closeEditModal = () => document.getElementById('modalEdit').classList.add('hidden');

        // --- NAVIGATION ---
        window.tab = (t) => {
            ['input','logs','settings'].forEach(k => {
                const view = document.getElementById('v_'+k);
                const btn = document.getElementById('t_'+k);
                if(view) view.classList.toggle('hidden', k !== t);
                if(btn) { 
                    btn.classList.toggle('tab-active', k === t); 
                    btn.classList.toggle('text-slate-400', k !== t); 
                    if(k === t) btn.classList.add('text-blue-600');
                    else btn.classList.remove('text-blue-600');
                }
            });
            if(t === 'logs') renderLogs();
        };

        window.msg = (m) => {
            const t = document.getElementById('toast'); t.innerText = m;
            t.style.opacity = "1"; setTimeout(() => t.style.opacity = "0", 3000);
        };

        // Global assignments
        window.saveUser = saveUser;
        window.resetUserForm = resetUserForm;
        window.editUserPrompt = editUserPrompt;
        window.deleteUser = deleteUser;
        window.addNewProject = addNewProject;
        window.resetProjectForm = resetProjectForm;
        window.editProjectPrompt = editProjectPrompt;
        window.deleteProject = deleteProject;
        window.deleteLog = deleteLog;
        window.editLogPrompt = editLogPrompt;
        window.confirmEditLog = confirmEditLog;
        window.closeEditModal = closeEditModal;
        window.addUserToProject = addUserToProject;
        window.toggleUserAssignment = toggleUserAssignment;
        window.tab = tab;
        window.renderLogs = renderLogs;
        window.changeUserPage = changeUserPage;
        window.changeProjPage = changeProjPage;
        window.handleProjSearch = handleProjSearch;
    </script>
</body>
</html>
