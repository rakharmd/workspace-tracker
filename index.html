<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WORKSPACE Tracker - Stable V1 (Fixed Zoom)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .tab-active { color: #2563eb; border-bottom: 3px solid #2563eb; }
        .card { border-radius: 1.5rem; border: 1px solid #e2e8f0; background: white; }
        #toast { transition: all 0.3s; pointer-events: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .btn-primary { background-color: #0f172a; color: white; transition: all 0.2s; }
        .btn-primary:active { transform: scale(0.95); }
        .modal-overlay { background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); }
        
        @keyframes pulse-red {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .notif-badge-active { animation: pulse-red 2s infinite; }

        .task-checkbox:checked + label { color: #2563eb; font-weight: 800; text-decoration: line-through; opacity: 0.6; }
        .sticky-note { background-color: #fef9c3; border-left: 6px solid #facc15; border-radius: 1rem; padding: 1.25rem; position: relative; }
        .sticky-note-textarea { background: transparent; border: none; outline: none; width: 100%; font-size: 13px; font-weight: 600; color: #854d0e; resize: none; line-height: 1.5; min-height: 150px; }

        .switch-finish { position: relative; display: inline-block; width: 44px; height: 22px; }
        .switch-finish input { opacity: 0; width: 0; height: 0; }
        .slider-finish { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #e2e8f0; transition: .4s; border-radius: 34px; }
        .slider-finish:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider-finish { background-color: #10b981; }
        input:checked + .slider-finish:before { transform: translateX(22px); }

        .rotate-180 { transform: rotate(180deg); }

        .editor-container { border: 1px solid #e2e8f0; border-radius: 1rem; overflow: hidden; background: white; }
        .editor-toolbar { display: flex; gap: 0.25rem; padding: 0.5rem; background: #f8fafc; border-bottom: 1px solid #e2e8f0; flex-wrap: wrap; }
        .toolbar-btn { padding: 0.4rem; border-radius: 0.5rem; transition: all 0.2s; color: #64748b; font-size: 11px; font-weight: 700; }
        .toolbar-btn:hover { background: #e2e8f0; color: #0f172a; }
        .editor-content { padding: 1rem; min-height: 200px; max-height: 400px; overflow-y: auto; outline: none; font-size: 13px; line-height: 1.6; color: #334155; }
        .editor-content ul { list-style-type: disc; padding-left: 1.5rem; }

        .badge-notes { background-color: #facc15; color: #713f12; font-size: 7px; font-weight: 900; padding: 2px 6px; border-radius: 6px; text-transform: uppercase; letter-spacing: 0.05em; box-shadow: 0 2px 4px rgba(234, 179, 8, 0.2); }
        
        /* CSS KHUSUS GAMBAR DI LAPORAN */
        .log-content img, #f_work_editor img { 
            max-width: 100%; 
            height: auto; 
            border-radius: 1rem; 
            border: 1px solid #e2e8f0; 
            margin: 12px 0; 
            display: block; 
            cursor: zoom-in; 
            transition: all 0.2s;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        .log-content img:hover { transform: scale(1.01); box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); }

        .dragging { opacity: 0.5; border: 2px dashed #3b82f6; }
        .drag-over { border-top: 4px solid #3b82f6 !important; }
        
        .user-pill { background: #eff6ff; color: #1e40af; border: 1px solid #dbeafe; }
    </style>
</head>
<body class="pb-10">

    <!-- 1. HALAMAN LOGIN -->
    <div id="loginPage" class="flex items-center justify-center min-h-screen p-4 bg-slate-50">
        <div class="bg-white w-full max-w-md p-10 rounded-[2.5rem] shadow-2xl border border-slate-100 text-center">
            <h1 class="text-3xl font-extrabold text-slate-900 mb-1 tracking-tighter italic uppercase">WORKSPACE</h1>
            <p class="text-slate-400 text-[10px] mb-8 font-bold tracking-[0.3em] uppercase">Architecture Studio System</p>
            <form id="loginForm" class="space-y-4 text-left">
                <input type="text" id="u" placeholder="Username" required class="w-full p-4 border rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50 text-sm font-semibold">
                <input type="password" id="p" placeholder="Password" required class="w-full p-4 border rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50 text-sm font-semibold">
                <button type="submit" id="btnLogin" class="w-full btn-primary font-bold py-4 rounded-2xl shadow-lg uppercase tracking-widest text-xs">Masuk Sekarang</button>
            </form>
            <p id="statusDB" class="mt-6 text-[9px] text-slate-400 uppercase font-bold tracking-widest italic">Menghubungkan Database...</p>
        </div>
    </div>

    <!-- 2. APLIKASI UTAMA (MAIN APP) -->
    <div id="mainApp" class="hidden max-w-4xl mx-auto">
        <header class="p-6 bg-white/80 backdrop-blur border-b flex justify-between items-center sticky top-0 z-50 shadow-sm">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-blue-100">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" /></svg>
                </div>
                <div>
                    <h2 id="uDisp" class="font-bold text-slate-800 text-lg uppercase tracking-tight italic text-blue-600 leading-none mb-1">User</h2>
                    <span id="rDisp" class="text-[8px] bg-slate-900 text-white px-2 py-0.5 rounded-full font-bold uppercase tracking-widest">Role</span>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <div class="relative">
                    <button onclick="toggleNotifPanel()" class="p-2.5 bg-slate-50 rounded-full border border-slate-100 text-slate-400 hover:text-blue-600 transition-colors relative">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" /></svg>
                        <span id="notifCount" class="hidden absolute top-0 right-0 w-4 h-4 bg-red-500 text-white text-[8px] font-black rounded-full flex items-center justify-center border-2 border-white notif-badge-active">0</span>
                    </button>
                    <div id="notifPanel" class="hidden absolute right-0 mt-3 w-72 bg-white rounded-2xl shadow-2xl border border-slate-100 z-[60] overflow-hidden">
                        <div class="p-4 bg-slate-50 border-b flex justify-between items-center"><span class="text-[10px] font-extrabold uppercase text-slate-500 tracking-widest">Pemberitahuan Deadline</span></div>
                        <div id="notifList" class="max-h-80 overflow-y-auto p-2 space-y-2"></div>
                    </div>
                </div>
                <button onclick="logout()" class="text-[10px] font-bold text-red-500 bg-red-50 px-4 py-2 rounded-full border border-red-100 uppercase transition-all hover:bg-red-100">Logout</button>
            </div>
        </header>

        <nav class="flex bg-white border-b sticky top-[77px] z-40 overflow-x-auto no-scrollbar">
            <button onclick="tab('input')" id="t_input" class="flex-1 py-4 text-[11px] font-bold tab-active uppercase tracking-widest">Input</button>
            <button onclick="tab('logs')" id="t_logs" class="flex-1 py-4 text-[11px] font-bold text-slate-400 uppercase tracking-widest">Pantauan</button>
            <button onclick="tab('projek')" id="t_projek" class="hidden flex-1 py-4 text-[11px] font-bold text-slate-400 uppercase tracking-widest">Projek</button>
            <button onclick="tab('settings')" id="t_settings" class="hidden flex-1 py-4 text-[11px] font-bold text-slate-400 uppercase tracking-widest">Settings</button>
        </nav>

        <main class="p-4">
            <!-- VIEW: INPUT PROGRES -->
            <section id="v_input" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="md:col-span-2 space-y-6">
                    <div class="card p-6 shadow-sm border-blue-50">
                        <form id="progressForm" class="space-y-4">
                            <label class="text-[9px] font-bold text-slate-400 uppercase ml-1 tracking-wider">Tanggal Kerja</label>
                            <input type="date" id="f_date" required class="w-full p-3 border rounded-xl bg-slate-50 outline-none text-sm font-semibold border-slate-200">
                            <label class="text-[9px] font-bold text-slate-400 uppercase ml-1 tracking-wider">Pilih Projek</label>
                            <select id="f_proj" required class="w-full p-3 border rounded-xl bg-white font-bold text-slate-700 text-sm outline-none border-slate-200"></select>
                            
                            <label class="text-[9px] font-bold text-slate-400 uppercase ml-1 tracking-wider uppercase">Laporan Pekerjaan & Dokumentasi</label>
                            <div class="editor-container">
                                <div id="f_work_toolbar" class="editor-toolbar">
                                    <button type="button" onclick="insertBullet('f_work_editor')" class="toolbar-btn" title="Bullet List">• List</button>
                                    <button type="button" onclick="triggerImageInput()" class="toolbar-btn" title="Insert Image">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                    </button>
                                    <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
                                </div>
                                <div id="f_work_editor" contenteditable="true" class="editor-content w-full focus:ring-2 focus:ring-blue-100" placeholder="Tuliskan progres kerja hari ini... (Bisa copy-paste gambar ke sini)"></div>
                            </div>
                            
                            <button type="submit" id="btnSubmitLog" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl shadow-lg uppercase text-[10px] tracking-widest active:scale-95 transition-all">Simpan Progres</button>
                        </form>
                    </div>

                    <div class="card p-6 shadow-sm border-slate-100">
                        <h3 class="text-[10px] font-extrabold text-slate-800 uppercase mb-4 tracking-widest flex items-center gap-2"><span class="w-2 h-2 bg-purple-600 rounded-full"></span> Catatan Pribadi Akun</h3>
                        <div class="editor-container">
                            <div class="editor-toolbar">
                                <button type="button" onclick="formatDoc('bold')" class="toolbar-btn" title="Bold">B</button>
                                <button type="button" onclick="formatDoc('italic')" class="toolbar-btn italic" title="Italic">I</button>
                                <button type="button" onclick="formatDoc('underline')" class="toolbar-btn underline" title="Underline">U</button>
                                <button type="button" onclick="insertBullet('personalNoteEditor')" class="toolbar-btn" title="List">• List</button>
                            </div>
                            <div id="personalNoteEditor" contenteditable="true" class="editor-content" placeholder="Tulis catatan pribadi kamu di sini..."></div>
                        </div>
                        <div class="mt-3 flex justify-end">
                            <button id="btnSavePersonalNote" onclick="savePersonalNote()" class="bg-slate-900 text-white text-[10px] font-bold py-2.5 px-6 rounded-xl uppercase tracking-widest shadow-md">Simpan Catatan</button>
                        </div>
                    </div>
                </div>

                <div class="md:col-span-1 space-y-4">
                    <div class="card p-5 shadow-sm bg-slate-50/50 border-slate-100 h-fit sticky top-[150px]">
                        <h3 class="text-[10px] font-extrabold text-slate-800 uppercase mb-4 tracking-widest flex items-center gap-2"><span class="w-2 h-2 bg-blue-600 rounded-full"></span> Urutan Projek (Drag)</h3>
                        <div id="sideProjList" class="space-y-4 min-h-[100px]"></div>
                    </div>
                </div>
            </section>

            <!-- VIEW: PANTAUAN LOGS -->
            <section id="v_logs" class="hidden space-y-4 max-w-2xl mx-auto">
                <div class="card p-4 space-y-3 sticky top-[140px] z-30 shadow-xl border-slate-200 bg-white">
                    <div class="relative">
                        <input type="text" id="searchLog" oninput="renderLogs()" placeholder="Cari isi laporan kerja..." class="w-full p-2.5 pl-9 border rounded-xl text-xs outline-none bg-slate-50 border-slate-200 font-semibold focus:ring-1 focus:ring-blue-500">
                        <svg class="w-4 h-4 absolute left-3 top-2.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <select id="flUser" onchange="renderLogs()" class="p-2 border rounded-xl text-[10px] font-bold bg-white outline-none border-slate-200"></select>
                        <select id="flProj" onchange="renderLogs()" class="p-2 border rounded-xl text-[10px] font-bold bg-white outline-none border-slate-200"></select>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <input type="date" id="flStartDate" onchange="renderLogs()" class="p-2 border rounded-xl text-[10px] bg-white outline-none font-bold border-slate-200">
                        <input type="date" id="flEndDate" onchange="renderLogs()" class="p-2 border rounded-xl text-[10px] bg-white outline-none font-bold border-slate-200">
                    </div>
                </div>
                <div id="logList" class="space-y-4 pt-2"></div>
            </section>

            <!-- VIEW: PROJEK GLOBAL -->
            <section id="v_projek" class="hidden space-y-6 max-w-2xl mx-auto">
                <div class="card p-6 shadow-sm border-slate-100 bg-white">
                    <h3 class="text-xs font-bold text-slate-800 uppercase mb-4 tracking-widest flex items-center gap-2"><span class="w-2 h-2 bg-green-600 rounded-full"></span> Master Projek Global</h3>
                    <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-3 mb-6">
                        <p id="projFormTitle" class="text-[9px] font-extrabold text-slate-400 uppercase tracking-widest">Tambah / Edit Projek</p>
                        <input type="text" id="nP" placeholder="NAMA PROJEK..." class="w-full p-3 border rounded-xl text-sm outline-none uppercase font-bold border-slate-200 bg-white">
                        <div class="grid grid-cols-2 gap-2">
                            <div><label class="text-[8px] font-bold text-slate-400 ml-1">MULAI</label><input type="date" id="nPStart" class="w-full p-2.5 border rounded-xl text-xs bg-white outline-none"></div>
                            <div><label class="text-[8px] font-bold text-slate-400 ml-1">DEADLINE</label><input type="date" id="nPEnd" class="w-full p-2.5 border rounded-xl text-xs bg-white outline-none"></div>
                        </div>
                        <div class="flex gap-2">
                            <button id="btnCancelEditProj" onclick="resetProjectForm()" class="hidden flex-1 bg-slate-200 text-slate-600 font-bold py-3 rounded-xl text-[10px] uppercase">Batal</button>
                            <button id="btnAddNewProject" onclick="addNewProject()" class="flex-[2] bg-blue-600 text-white py-3 rounded-xl font-bold text-xs uppercase shadow-lg">Simpan Projek</button>
                        </div>
                    </div>
                    <div class="relative mb-4">
                        <input type="text" id="searchProj" oninput="handleProjSearch()" placeholder="Cari nama projek..." class="w-full p-3 pl-10 border rounded-xl text-xs outline-none bg-white border-slate-200"><svg class="w-4 h-4 absolute left-3.5 top-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </div>
                    <div id="projListSettings" class="space-y-4 mb-4"></div>
                    <div id="projPagination" class="flex justify-between items-center px-1"></div>
                </div>
            </section>

            <!-- VIEW: SETTINGS -->
            <section id="v_settings" class="hidden space-y-8 max-w-2xl mx-auto">
                <div class="card p-6 shadow-sm border-slate-100 bg-white">
                    <h3 class="text-xs font-bold text-slate-800 uppercase mb-4 tracking-widest flex items-center gap-2"><span class="w-2 h-2 bg-blue-600 rounded-full"></span> Manajemen Akun</h3>
                    <div class="space-y-4 mb-8">
                        <div class="grid grid-cols-2 gap-2"><input type="text" id="mU" placeholder="User" class="p-3 border rounded-xl text-sm outline-none bg-slate-50"><input type="text" id="mP" placeholder="Pass" class="p-3 border rounded-xl text-sm outline-none bg-slate-50"></div>
                        <select id="mR" class="w-full p-3 border rounded-xl text-sm outline-none bg-slate-50"><option value="USER">TIM (USER)</option><option value="ADMIN">ADMINISTRATOR</option></select>
                        <div class="flex gap-2">
                            <button id="btnCancelEdit" onclick="resetUserForm()" class="hidden flex-1 bg-slate-200 text-slate-600 font-bold py-3 rounded-xl text-[10px] uppercase">Batal</button>
                            <button onclick="saveUser()" id="btnSaveUser" class="flex-[2] bg-slate-900 text-white font-bold py-3 rounded-xl text-[10px] uppercase">Simpan Akun</button>
                        </div>
                    </div>
                    <div class="space-y-2 mb-4" id="userListSettings"></div>
                    <div id="userPagination" class="flex justify-between items-center px-1"></div>
                </div>
            </section>
        </main>
    </div>

    <!-- MODALS SECTION -->
    <div id="modalZoom" class="hidden fixed inset-0 z-[110] modal-overlay flex items-center justify-center p-4 cursor-zoom-out" onclick="closeZoomModal()">
        <div class="relative max-w-5xl w-full h-full flex items-center justify-center pointer-events-none">
            <img id="zoomedImg" src="" class="max-w-full max-h-full rounded-2xl shadow-2xl object-contain bg-white p-2 pointer-events-auto transition-transform duration-300">
            <button class="absolute top-4 right-4 bg-white/30 hover:bg-white/50 text-white p-3 rounded-full backdrop-blur-md transition-all pointer-events-auto">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>
    </div>

    <div id="modalEdit" class="hidden fixed inset-0 z-[100] modal-overlay flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md p-6 rounded-3xl shadow-2xl">
            <h3 class="text-xs font-bold text-slate-800 uppercase mb-4 tracking-widest">Edit Progres</h3>
            <div id="editLogWork" contenteditable="true" class="editor-content w-full p-4 border rounded-2xl bg-slate-50 min-h-[150px] outline-none"></div>
            <div class="flex gap-2 mt-4">
                <button onclick="closeEditModal()" class="flex-1 py-3 bg-slate-100 text-slate-500 rounded-xl font-bold text-xs uppercase">Batal</button>
                <button onclick="confirmEditLog()" class="flex-1 py-3 bg-blue-600 text-white rounded-xl font-bold text-xs uppercase">Simpan Perubahan</button>
            </div>
        </div>
    </div>

    <div id="modalSticky" class="hidden fixed inset-0 z-[110] modal-overlay flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-2xl rounded-3xl shadow-2xl overflow-hidden flex flex-col">
            <div class="p-6 bg-yellow-400 flex justify-between items-center text-yellow-900 font-black uppercase text-xs">
                <div class="flex items-center gap-2">
                    <svg class="h-4 w-4" fill="currentColor" viewBox="0 0 20 20"><path d="M17.414 2.586a2 2 0 00-2.828 0L7 10.172V13h2.828l7.586-7.586a2 2 0 000-2.828z" /><path d="M2 6a2 2 0 012-2h4l2 2H4v10h10v-4l2-2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z" /></svg>
                    <span id="stickyProjName">Catatan Detail</span>
                </div>
                <button onclick="closeStickyModal()" class="bg-yellow-500/50 p-1 rounded hover:scale-110 transition-transform">
                    <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="p-6 bg-yellow-50 flex-grow"><textarea id="stickyZoomArea" class="w-full h-[60vh] bg-transparent border-none outline-none font-bold text-slate-800 leading-relaxed text-base shadow-inner p-4"></textarea></div>
            <div class="p-4 bg-white border-t flex justify-end">
                <button id="btnSaveStickyModal" class="bg-yellow-400 text-yellow-900 px-8 py-3 rounded-full font-black text-xs uppercase shadow-md active:scale-95 transition-all">Simpan & Tutup</button>
            </div>
        </div>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-8 py-4 rounded-2xl shadow-2xl opacity-0 z-[100] text-[10px] font-bold uppercase tracking-widest text-center"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, collection, onSnapshot, addDoc, serverTimestamp, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyD-wrKOTP046d3Ojr_pKPHEWWf7Kuk5Nco",
            authDomain: "workspace-tracker-b3f8a.firebaseapp.com",
            projectId: "workspace-tracker-b3f8a",
            storageBucket: "workspace-tracker-b3f8a.firebasestorage.app",
            messagingSenderId: "347113310211",
            appId: "1:347113310211:web:900680ab7b8456a0f66636"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'workspace-tracker-final-v2';

        let currentUser = null;
        let logsData = [];
        let usersData = [];
        let projectsData = [];
        let isEditingUser = false;
        let isEditingProject = false;
        let editingProjectOldName = "";
        let openAdminProjName = null;
        let openProjectAccordions = new Set();
        let draggedProjectName = null;

        const PROGRESS_TASKS = [
            { key: "drafting", label: "Drafting" }, { key: "layouting", label: "Layouting" }, { key: "moodboard", label: "Moodboard" },
            { key: "design_ars", label: "Design Arsitektur" }, { key: "design_int", label: "Design Interior" }, { key: "gambar_ars", label: "Gmbr Kerja ARS" },
            { key: "gambar_elk", label: "Gmbr Kerja ELK" }, { key: "gambar_int", label: "Gmbr Kerja INT" }
        ];

        let usersCurrentPage = 1, usersPerPage = 5;
        let projsCurrentPage = 1, projsPerPage = 3;
        let projSearchQuery = "";

        const getLocalDateString = () => {
            const now = new Date();
            return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
        };

        const init = async () => {
            const savedUser = localStorage.getItem('ws_user');
            if (savedUser) currentUser = JSON.parse(savedUser);
            try {
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        document.getElementById('statusDB').innerText = "✅ Cloud Connected";
                        document.getElementById('statusDB').classList.replace('text-slate-400', 'text-green-600');
                        if(currentUser) startApp();
                    }
                });
                await signInAnonymously(auth);
            } catch (e) { document.getElementById('statusDB').innerText = "⚠️ Connection Error"; }
        };
        init();

        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnLogin'); btn.disabled = true; btn.innerText = "MENGECEK...";
            const u = document.getElementById('u').value.trim().toLowerCase();
            const p = document.getElementById('p').value.trim();
            const userRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', u);
            const userSnap = await getDoc(userRef);
            if (userSnap.exists() && userSnap.data().password === p) {
                currentUser = { username: u, ...userSnap.data() };
                localStorage.setItem('ws_user', JSON.stringify(currentUser));
                startApp();
            } else if (u === 'admin' && p === 'admin123') {
                currentUser = { username: 'admin', role: 'ADMIN' };
                await setDoc(userRef, { password: 'admin123', role: 'ADMIN' });
                localStorage.setItem('ws_user', JSON.stringify(currentUser));
                startApp();
            } else { msg("❌ LOGIN GAGAL"); btn.disabled = false; btn.innerText = "Masuk Sekarang"; }
        };

        function startApp() {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            document.getElementById('uDisp').innerText = currentUser.username.toUpperCase();
            document.getElementById('rDisp').innerText = currentUser.role;
            document.getElementById('f_date').value = getLocalDateString();
            if (currentUser.privateNotes) document.getElementById('personalNoteEditor').innerHTML = currentUser.privateNotes;
            if (currentUser.role === 'ADMIN') {
                document.getElementById('t_projek').classList.remove('hidden');
                document.getElementById('t_settings').classList.remove('hidden');
            }
            listenUsers(); listenProjects(); listenLogs(); tab('input');
        }

        window.logout = () => { if (confirm("Keluar dari aplikasi?")) { localStorage.removeItem('ws_user'); location.reload(); } };

        // --- MANAJEMEN LISTENERS ---
        function listenProjects() {
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'projects'), (snap) => {
                projectsData = snap.docs.map(d => ({ name: d.id, ...d.data() })).sort((a, b) => (a.order || 0) - (b.order || 0));
                renderProjectList(); renderInputDropdowns(); renderSidebarDeadlines(); checkDeadlines();
            });
        }
        function listenUsers() {
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'users'), (snap) => {
                usersData = snap.docs.map(d => ({ id: d.id, ...d.data() })); renderUserList();
            });
        }
        function listenLogs() {
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'logs'), (snap) => {
                logsData = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => {
                    const timeA = a.ts ? (a.ts.seconds * 1000) : 0;
                    const timeB = b.ts ? (b.ts.seconds * 1000) : 0;
                    return timeB - timeA || new Date(b.tanggal) - new Date(a.tanggal);
                });
                renderLogs();
            });
        }

        // --- UI & RENDERING ---
        window.renderLogs = () => {
            const list = document.getElementById('logList'); if(!list) return;
            const fP = document.getElementById('flProj').value; 
            const fU = (currentUser.role === 'ADMIN') ? document.getElementById('flUser').value : 'ALL';
            const fK = document.getElementById('searchLog').value.toLowerCase();
            const fStart = document.getElementById('flStartDate').value;
            const fEnd = document.getElementById('flEndDate').value;

            const filtered = logsData.filter(l => {
                const matchProj = fP === 'ALL' || l.project_name === fP; 
                const matchUser = fU === 'ALL' || l.username === fU;
                const matchKey = (l.pekerjaan || "").toLowerCase().includes(fK) || (l.username || "").toLowerCase().includes(fK);
                let matchDate = true;
                if (fStart && l.tanggal < fStart) matchDate = false;
                if (fEnd && l.tanggal > fEnd) matchDate = false;
                return matchProj && matchUser && matchKey && matchDate;
            });

            list.innerHTML = filtered.length ? '' : '<p class="text-center py-20 text-[10px] opacity-20 font-bold italic">Belum ada data</p>';
            let lastDate = "", isWhite = true;
            filtered.forEach(l => {
                const canEdit = l.username === currentUser.username || currentUser.role === 'ADMIN';
                const timeStr = l.ts ? new Date(l.ts.seconds * 1000).toLocaleTimeString('id-ID', {hour: '2-digit', minute:'2-digit'}) : '';
                if (l.tanggal !== lastDate) { isWhite = !isWhite; lastDate = l.tanggal; }
                const bgColorClass = isWhite ? 'bg-white' : 'bg-emerald-50';
                list.innerHTML += `
                    <div class="${bgColorClass} p-6 rounded-[2rem] shadow-sm border border-slate-100 transition-all">
                        <div class="flex justify-between items-start mb-4">
                            <div class="space-y-1">
                                <span class="text-[9px] font-black bg-blue-50 text-blue-600 px-3 py-1 rounded-full uppercase">${l.username} &bull; ${l.project_name}</span>
                                <p class="text-sm font-extrabold text-slate-800">${new Date(l.tanggal).toLocaleDateString('id-ID', {day:'2-digit', month:'long', year:'numeric'})} ${timeStr ? `<span class="text-[10px] text-slate-300 font-bold ml-1">@ ${timeStr}</span>` : ''}</p>
                            </div>
                            ${canEdit ? `
                            <div class="flex gap-1">
                                <button onclick="editLogPrompt('${l.id}')" class="p-2 border rounded-full text-slate-300 hover:text-blue-500 transition-all"><svg class="h-4 w-4" fill="none" stroke="currentColor"><path d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" /></svg></button>
                                <button onclick="deleteLog('${l.id}')" class="p-2 border rounded-full text-slate-300 hover:text-red-500 transition-all"><svg class="h-4 w-4" fill="none" stroke="currentColor"><path d="M19 7l-.867 12.142A2 2.032 0 0116.138 21H7.862a2 2.032 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg></button>
                            </div>` : ''}
                        </div>
                        <div class="log-content text-[13px] text-slate-600 leading-relaxed font-semibold">${l.pekerjaan || ""}</div>
                    </div>`;
            });
        };

        window.renderSidebarDeadlines = () => {
            const sideList = document.getElementById('sideProjList'); if(!sideList) return;
            const userProjects = projectsData.filter(proj => currentUser.role === 'ADMIN' || (proj.assignedUsers || []).includes(currentUser.username));
            sideList.innerHTML = userProjects.length ? '' : '<p class="text-[9px] text-slate-400 text-center py-10 uppercase tracking-widest font-black italic opacity-20">No Project Active</p>';
            userProjects.forEach((proj) => {
                const deadlineStr = proj.endDate ? new Date(proj.endDate).toLocaleDateString('id-ID', {day:'2-digit', month:'short', year:'numeric'}) : 'No Deadline';
                const progress = calculateProgress(proj.tasks); const isFinished = proj.isFinished || false; const safeName = proj.name.replace(/\s+/g, '_');
                const isOpen = openProjectAccordions.has(proj.name);
                let dateBoxClass = "bg-white border-slate-200 text-slate-800"; 
                if (proj.endDate) {
                    const diff = Math.ceil((new Date(proj.endDate) - new Date().setHours(0,0,0,0)) / 86400000);
                    if (diff <= 0) dateBoxClass = "bg-black text-white border-black";
                    else if (diff <= 3) dateBoxClass = "bg-red-500 text-white border-red-500 shadow-lg shadow-red-100";
                }
                let checklistHtml = '';
                PROGRESS_TASKS.forEach(t => {
                    const isChecked = proj.tasks && proj.tasks[t.key];
                    checklistHtml += `<div class="flex items-center gap-2 py-0.5"><input type="checkbox" id="task_${safeName}_${t.key}" class="task-checkbox w-3.5 h-3.5 rounded-lg border-slate-300" ${isChecked ? 'checked' : ''} onchange="toggleTask('${proj.name}', '${t.key}', this.checked)"><label for="task_${safeName}_${t.key}" class="text-[8.5px] font-bold uppercase ${isFinished ? 'text-slate-400 line-through' : 'text-slate-500'} cursor-pointer">${t.label}</label></div>`;
                });
                sideList.innerHTML += `
                    <div class="project-card rounded-2xl border ${isFinished ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-100 shadow-sm'} overflow-hidden transition-all cursor-move" draggable="true" data-name="${proj.name}" ondragstart="handleDragStart(event, '${proj.name}')" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event, '${proj.name}')">
                        <div class="p-4">
                            <div class="flex justify-between items-start mb-3 pointer-events-none">
                                <div class="flex-grow space-y-1">
                                    <div class="flex items-center gap-2 flex-wrap">
                                        <span class="text-[10px] font-extrabold uppercase truncate ${isFinished ? 'text-white' : 'text-slate-800'}">${proj.name}</span>
                                        <span class="text-[9px] font-black ${isFinished ? 'text-green-400' : 'text-blue-600'}">${Math.round(progress)}%</span>
                                        ${proj.notes ? `<span class="badge-notes">NOTES</span>` : ''}
                                    </div>
                                    <div class="inline-block px-2.5 py-1 rounded-lg border text-[9px] font-extrabold ${isFinished ? 'opacity-50' : dateBoxClass}">${deadlineStr}</div>
                                </div>
                                <div class="flex flex-col items-end gap-1 shrink-0 ml-2 pointer-events-auto">
                                    <span class="text-[7px] font-black uppercase tracking-widest ${isFinished ? 'text-green-400' : 'text-slate-400'}">Finish</span>
                                    <label class="switch-finish"><input type="checkbox" ${isFinished ? 'checked' : ''} onchange="toggleFinishProject('${proj.name}', this.checked)"><span class="slider-finish"></span></label>
                                </div>
                            </div>
                            <div class="flex items-center gap-3">
                                <div class="flex-grow ${isFinished ? 'bg-slate-700' : 'bg-slate-100'} h-1.5 rounded-full overflow-hidden pointer-events-none"><div class="${isFinished ? 'bg-green-500' : 'bg-blue-600'} h-full transition-all duration-500" style="width: ${progress}%"></div></div>
                                <button onclick="toggleAccordion(this, '${proj.name}')" class="p-1 rounded-full hover:bg-slate-50 transition-colors group"><svg class="w-4 h-4 text-slate-300 group-hover:text-blue-500 transition-transform arrow-icon ${isOpen ? 'rotate-180' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M19 9l-7 7-7-7"></path></svg></button>
                            </div>
                        </div>
                        <div class="${isOpen ? '' : 'hidden'} px-4 pb-4 border-t ${isFinished ? 'border-slate-700 bg-slate-800/50' : 'border-slate-50'} mt-1 accordion-body">
                             <div class="grid grid-cols-2 gap-x-2 bg-slate-50/50 p-2.5 rounded-xl my-4">${checklistHtml}</div>
                             <div class="sticky-note">
                                <button onclick="openStickyZoom('${proj.name}')" class="absolute top-2 right-2 p-1.5 bg-white/50 hover:bg-white rounded-lg shadow-sm text-yellow-900 transition-all z-10"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg></button>
                                <textarea id="note_${safeName}" class="sticky-note-textarea" placeholder="Catatan projek...">${proj.notes || ""}</textarea>
                                <div class="flex justify-between items-center mt-2">
                                    <button onclick="insertBullet('note_${safeName}')" class="text-[10px] font-bold bg-white text-slate-600 px-3 py-1.5 rounded-full border border-slate-200 uppercase tracking-widest shadow-sm">• List</button>
                                    <button onclick="saveProjectNote('${proj.name}', 'note_${safeName}')" class="text-[10px] font-bold bg-yellow-400 text-yellow-900 px-4 py-2 rounded-full uppercase tracking-widest shadow-sm">Simpan</button>
                                </div>
                             </div>
                        </div>
                    </div>`;
            });
        };

        // --- CORE FUNCTIONS ---
        window.tab = (t) => {
            ['input','logs','projek','settings'].forEach(k => {
                const v = document.getElementById('v_'+k), b = document.getElementById('t_'+k);
                if(v) v.classList.toggle('hidden', k !== t);
                if(b) { b.classList.toggle('tab-active', k === t); b.classList.toggle('text-slate-400', k !== t); if(k === t) b.classList.add('text-blue-600'); }
            });
        };

        window.triggerImageInput = () => document.getElementById('imageInput').click();
        window.handleImageUpload = (e) => {
            const file = e.target.files[0]; if(!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                document.getElementById('f_work_editor').focus();
                document.execCommand('insertImage', false, ev.target.result);
            };
            reader.readAsDataURL(file);
        };

        window.openZoomModal = (src) => {
            const modal = document.getElementById('modalZoom');
            const img = document.getElementById('zoomedImg');
            img.src = src;
            modal.classList.remove('hidden');
        };
        window.closeZoomModal = () => document.getElementById('modalZoom').classList.add('hidden');

        // FIXED ZOOM IMAGE DELEGATION
        document.addEventListener('click', (e) => {
            const img = e.target.closest('.log-content img');
            if (img) {
                e.preventDefault();
                e.stopPropagation();
                openZoomModal(img.src);
            }
        });

        window.msg = (m) => { const t = document.getElementById('toast'); t.innerText = m; t.style.opacity = "1"; t.style.bottom = "40px"; setTimeout(() => { t.style.opacity = "0"; t.style.bottom = "10px"; }, 3000); };

        function calculateProgress(t = {}) { return (PROGRESS_TASKS.filter(x => t[x.key]).length / PROGRESS_TASKS.length) * 100; }

        function renderInputDropdowns() {
            const fp = document.getElementById('f_proj'), flp = document.getElementById('flProj'), flu = document.getElementById('flUser');
            if(!fp || !flp) return;
            fp.innerHTML = '<option value="" disabled selected>-- Pilih Projek --</option>';
            flp.innerHTML = '<option value="ALL">SEMUA PROJEK</option>';
            if(currentUser.role==='ADMIN' && flu) {
                flu.innerHTML = '<option value="ALL">SEMUA TIM</option>';
                usersData.sort((a,b)=>a.id.localeCompare(b.id)).forEach(u => flu.add(new Option(u.id.toUpperCase(), u.id)));
            }
            projectsData.forEach(p => {
                if(currentUser.role==='ADMIN' || (p.assignedUsers||[]).includes(currentUser.username)) {
                    fp.add(new Option(p.name, p.name)); flp.add(new Option(p.name, p.name));
                }
            });
        }

        function checkDeadlines() {
            const b = document.getElementById('notifCount'), l = document.getElementById('notifList'); if(!b || !currentUser) return;
            let c = 0, h = '';
            projectsData.forEach(p => {
                if(p.isFinished) return;
                const ass = p.assignedUsers || [];
                if(currentUser.role==='ADMIN' || ass.includes(currentUser.username)) {
                    const diff = Math.ceil((new Date(p.endDate) - new Date().setHours(0,0,0,0)) / 86400000);
                    if(diff <= 3) {
                        c++;
                        const clr = diff <= 0 ? 'bg-black text-white' : 'bg-red-50 text-red-600 border-red-100';
                        h += `<div class="p-3 rounded-xl border ${clr} text-[9px] uppercase font-black tracking-widest shadow-sm">${diff <= 0 ? 'OVERDUE' : diff+' HARI LAGI'}: ${p.name}</div>`;
                    }
                }
            });
            b.innerText = c; b.classList.toggle('hidden', c===0);
            l.innerHTML = h || '<p class="text-[9px] text-slate-300 text-center py-6 font-bold uppercase italic">Aman, No Deadlines</p>';
        }

        // --- CRUD ACTIONS ---
        document.getElementById('progressForm').onsubmit = async (e) => {
            e.preventDefault(); 
            const work = document.getElementById('f_work_editor').innerHTML;
            if(!document.getElementById('f_proj').value) return msg("PILIH PROJEK!");
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'logs'), { 
                tanggal: document.getElementById('f_date').value, 
                username: currentUser.username, 
                project_name: document.getElementById('f_proj').value, 
                pekerjaan: work, 
                ts: serverTimestamp() 
            });
            document.getElementById('f_work_editor').innerHTML = ''; msg("✅ PROGRES DISIMPAN");
        };

        window.deleteLog = async (id) => { if(confirm("Hapus log ini?")) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'logs', id)); };
        window.savePersonalNote = async () => { await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', currentUser.username), { privateNotes: document.getElementById('personalNoteEditor').innerHTML }); msg("✅ CATATAN DISIMPAN"); };
        window.saveProjectNote = async (p, id) => { await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'projects', p), { notes: document.getElementById(id).value }); msg("✅ CATATAN PROJEK DISIMPAN"); };
        window.toggleFinishProject = async (p, c) => { await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'projects', p), { isFinished: c }); msg(c ? "✅ PROJEK FINISH" : "🔄 PROJEK AKTIF"); };
        window.toggleTask = async (p, k, c) => { const proj = projectsData.find(x=>x.name===p); const tasks = {...(proj.tasks||{})}; tasks[k]=c; await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'projects', p), { tasks }); };

        window.formatDoc = (cmd) => { document.execCommand(cmd, false, null); };
        window.insertBullet = (id) => { const el = document.getElementById(id); el.focus(); document.execCommand('insertUnorderedList', false, null); };
        window.toggleAccordion = (btn, name) => { const body = btn.closest('.project-card').querySelector('.accordion-body'), icon = btn.querySelector('.arrow-icon'); const close = !body.classList.contains('hidden'); body.classList.toggle('hidden', close); icon.classList.toggle('rotate-180', !close); close ? openProjectAccordions.delete(name) : openProjectAccordions.add(name); };
        window.toggleNotifPanel = () => document.getElementById('notifPanel').classList.toggle('hidden');
        window.openStickyZoom = (p) => { const proj = projectsData.find(x=>x.name===p); document.getElementById('stickyProjName').innerText = p; document.getElementById('stickyZoomArea').value = proj.notes||""; document.getElementById('btnSaveStickyModal').onclick = () => { saveProjectNote(p, 'stickyZoomArea'); closeStickyModal(); }; document.getElementById('modalSticky').classList.remove('hidden'); };
        window.closeStickyModal = () => document.getElementById('modalSticky').classList.add('hidden');

        // --- DRAG & DROP URUTAN ---
        window.handleDragStart = (e, name) => { draggedProjectName = name; e.currentTarget.classList.add('dragging'); };
        window.handleDragOver = (e) => { e.preventDefault(); e.currentTarget.classList.add('drag-over'); };
        window.handleDragLeave = (e) => e.currentTarget.classList.remove('drag-over');
        window.handleDrop = async (e, targetName) => {
            e.preventDefault(); e.currentTarget.classList.remove('drag-over');
            if (draggedProjectName === targetName) return;
            const fromIdx = projectsData.findIndex(p => p.name === draggedProjectName), toIdx = projectsData.findIndex(p => p.name === targetName);
            const reordered = [...projectsData]; const [item] = reordered.splice(fromIdx, 1); reordered.splice(toIdx, 0, item);
            projectsData = reordered; renderSidebarDeadlines();
            const batch = writeBatch(db);
            reordered.forEach((p, i) => batch.update(doc(db, 'artifacts', appId, 'public', 'data', 'projects', p.name), { order: i }));
            await batch.commit(); msg("✅ URUTAN DIPERBARUI");
        };

        // --- ADMIN ACTIONS (PROJEK & SETTINGS) ---
        window.renderProjectList = () => { /* Logic render master projek setting */ };
        window.renderUserList = () => { /* Logic render master user setting */ };

    </script>
</body>
</html>
