<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WORKSPACE Tracker - Project Timeline</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .tab-active { color: #2563eb; border-bottom: 3px solid #2563eb; }
        .card { background: white; border-radius: 1.5rem; border: 1px solid #e2e8f0; }
        #toast { transition: opacity 0.3s; pointer-events: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .btn-primary { background-color: #0f172a; color: white; transition: all 0.2s; }
        .btn-primary:active { transform: scale(0.95); }
        .modal-overlay { background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); }
        .input-disabled { background-color: #f1f5f9; color: #94a3b8; cursor: not-allowed; }
        .user-pill { background-color: #eff6ff; border: 1px solid #dbeafe; color: #2563eb; }
        .page-btn { padding: 0.5rem 1rem; border-radius: 0.75rem; background: white; border: 1px solid #e2e8f0; font-size: 0.75rem; font-weight: 700; color: #64748b; transition: all 0.2s; }
        .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .page-btn:not(:disabled):hover { border-color: #2563eb; color: #2563eb; }
        
        /* Animasi Lonceng */
        @keyframes pulse-red {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .notif-badge-active { animation: pulse-red 2s infinite; }

        /* Custom Checkbox */
        .task-checkbox:checked + label { color: #2563eb; font-weight: 800; text-decoration: line-through; opacity: 0.6; }
        
        /* Accordion transition */
        .accordion-content { transition: max-height 0.3s ease-out; overflow: hidden; }

        /* Checkbox Read Only Style */
        .checkbox-readonly { filter: grayscale(1); opacity: 0.5; cursor: not-allowed; }
        .label-readonly { color: #94a3b8; font-size: 8px; font-weight: 700; text-transform: uppercase; }
        .label-readonly.checked { color: #64748b; text-decoration: line-through; }

        /* Sticky Note Style - Enlarged */
        .sticky-note { background-color: #fef9c3; border-left: 6px solid #facc15; border-radius: 1rem; padding: 1.25rem; }
        .sticky-note-textarea { background: transparent; border: none; outline: none; width: 100%; font-size: 13px; font-weight: 600; color: #854d0e; resize: none; line-height: 1.5; min-height: 150px; }

        /* Switch Finish Style */
        .switch-finish { position: relative; display: inline-block; width: 50px; height: 24px; }
        .switch-finish input { opacity: 0; width: 0; height: 0; }
        .slider-finish { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #e2e8f0; transition: .4s; border-radius: 34px; }
        .slider-finish:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider-finish { background-color: #10b981; }
        input:checked + .slider-finish:before { transform: translateX(26px); }
    </style>
</head>
<body class="pb-10">

    <!-- HALAMAN LOGIN -->
    <div id="loginPage" class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-white w-full max-w-md p-10 rounded-[2.5rem] shadow-2xl border-none text-center border border-slate-100">
            <h1 class="text-3xl font-extrabold text-slate-900 mb-1 tracking-tighter italic uppercase">WORKSPACE</h1>
            <p class="text-slate-400 text-[10px] mb-8 font-bold tracking-[0.3em] uppercase">Firebase Managed System</p>
            
            <form id="loginForm" class="space-y-4 text-left">
                <input type="text" id="u" placeholder="Username" required class="w-full p-4 border rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50 text-sm">
                <input type="password" id="p" placeholder="Password" required class="w-full p-4 border rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50 text-sm">
                <button type="submit" id="btnLogin" class="w-full btn-primary font-bold py-4 rounded-2xl shadow-lg uppercase tracking-widest text-xs">Masuk Sekarang</button>
            </form>
            <p id="statusDB" class="mt-6 text-[9px] text-slate-400 uppercase font-bold tracking-widest italic">Menghubungkan Database...</p>
        </div>
    </div>

    <!-- APLIKASI UTAMA -->
    <div id="mainApp" class="hidden max-w-4xl mx-auto">
        <header class="p-6 bg-white/80 backdrop-blur border-b flex justify-between items-center sticky top-0 z-50 shadow-sm">
            <div class="flex items-center gap-4">
                <div>
                    <h2 id="uDisp" class="font-bold text-slate-800 text-lg uppercase tracking-tight italic text-blue-600">User</h2>
                    <span id="rDisp" class="text-[9px] bg-slate-900 text-white px-2 py-0.5 rounded-full font-bold uppercase tracking-widest">Role</span>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <div class="relative">
                    <button onclick="toggleNotifPanel()" class="p-2.5 bg-slate-50 rounded-full border border-slate-100 text-slate-400 hover:text-blue-600 transition-colors relative">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                        </svg>
                        <span id="notifCount" class="hidden absolute top-0 right-0 w-4 h-4 bg-red-500 text-white text-[8px] font-black rounded-full flex items-center justify-center border-2 border-white notif-badge-active">0</span>
                    </button>
                    <div id="notifPanel" class="hidden absolute right-0 mt-3 w-72 bg-white rounded-2xl shadow-2xl border border-slate-100 z-[60] overflow-hidden">
                        <div class="p-4 bg-slate-50 border-b flex justify-between items-center">
                            <span class="text-[10px] font-extrabold uppercase text-slate-500 tracking-widest">Pemberitahuan Deadline</span>
                        </div>
                        <div id="notifList" class="max-h-80 overflow-y-auto p-2 space-y-2"></div>
                    </div>
                </div>
                <button onclick="location.reload()" class="text-[10px] font-bold text-red-500 bg-red-50 px-4 py-2 rounded-full border border-red-100 uppercase">Logout</button>
            </div>
        </header>

        <nav class="flex bg-white border-b sticky top-[77px] z-40 overflow-x-auto no-scrollbar">
            <button onclick="tab('input')" id="t_input" class="flex-1 py-4 text-[11px] font-bold tab-active uppercase tracking-widest">Input</button>
            <button onclick="tab('logs')" id="t_logs" class="flex-1 py-4 text-[11px] font-bold text-slate-400 uppercase tracking-widest">Pantauan</button>
            <button onclick="tab('projek')" id="t_projek" class="hidden flex-1 py-4 text-[11px] font-bold text-slate-400 uppercase tracking-widest">Projek</button>
            <button onclick="tab('settings')" id="t_settings" class="hidden flex-1 py-4 text-[11px] font-bold text-slate-400 uppercase tracking-widest">Settings</button>
        </nav>

        <main class="p-4">
            <!-- VIEW: INPUT PROGRES -->
            <section id="v_input" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="md:col-span-2 space-y-4">
                    <div class="card p-6 shadow-sm border-blue-50">
                        <form id="progressForm" class="space-y-4">
                            <label class="text-[9px] font-bold text-slate-400 uppercase ml-1 tracking-wider">Tanggal Kerja</label>
                            <input type="date" id="f_date" required class="w-full p-3 border rounded-xl bg-slate-50 outline-none text-sm font-semibold">
                            <label class="text-[9px] font-bold text-slate-400 uppercase ml-1 tracking-wider">Pilih Projek</label>
                            <select id="f_proj" required class="w-full p-3 border rounded-xl bg-white font-bold text-slate-700 text-sm outline-none border-slate-200"></select>
                            <label class="text-[9px] font-bold text-slate-400 uppercase ml-1 tracking-wider">Detail Pekerjaan (Progres)</label>
                            <textarea id="f_work" rows="5" placeholder="Tuliskan apa yang kamu kerjakan hari ini..." required class="w-full p-3 border rounded-xl bg-slate-50 outline-none text-sm leading-relaxed"></textarea>
                            <button type="submit" id="btnSubmitLog" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl shadow-lg uppercase text-[10px] tracking-widest active:scale-95 transition-all">Simpan Progres</button>
                        </form>
                    </div>
                </div>

                <div class="md:col-span-1 space-y-4">
                    <div class="card p-5 shadow-sm bg-slate-50/50 border-slate-100 h-fit">
                        <h3 class="text-[10px] font-extrabold text-slate-800 uppercase mb-4 tracking-widest flex items-center gap-2">
                            <span class="w-2 h-2 bg-blue-600 rounded-full"></span> Detail Progres Projek
                        </h3>
                        <div id="sideProjList" class="space-y-4"></div>
                    </div>
                </div>
            </section>

            <!-- VIEW: PANTAUAN LOGS -->
            <section id="v_logs" class="hidden space-y-4 max-w-2xl mx-auto">
                <div class="card p-4 space-y-3 sticky top-[140px] z-30 shadow-xl border-slate-200">
                    <div class="relative">
                        <input type="text" id="searchLog" oninput="renderLogs()" placeholder="Cari isi laporan kerja..." class="w-full p-2.5 pl-9 border rounded-xl text-xs outline-none bg-slate-50 border-slate-200 font-semibold focus:ring-1 focus:ring-blue-500">
                        <svg class="w-4 h-4 absolute left-3 top-2.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                        <div class="flex gap-2">
                            <select id="flUser" onchange="renderLogs()" class="flex-1 p-2 border rounded-xl text-[10px] font-bold bg-white outline-none border-slate-200"></select>
                            <select id="flProj" onchange="renderLogs()" class="flex-1 p-2 border rounded-xl text-[10px] font-bold bg-white outline-none border-slate-200"></select>
                        </div>
                        <div class="flex gap-2">
                            <input type="date" id="flStartDate" onchange="renderLogs()" class="flex-1 p-2 border rounded-xl text-[10px] bg-white outline-none font-bold border-slate-200">
                            <input type="date" id="flEndDate" onchange="renderLogs()" class="flex-1 p-2 border rounded-xl text-[10px] bg-white outline-none font-bold border-slate-200">
                        </div>
                    </div>
                </div>
                <div id="logList" class="space-y-4 pt-2"></div>
            </section>

            <!-- VIEW: MANAJEMEN PROJEK (TAB PROJEK) -->
            <section id="v_projek" class="hidden space-y-6 max-w-2xl mx-auto">
                <div class="card p-6 shadow-sm border-slate-100">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-xs font-bold text-slate-800 uppercase tracking-widest flex items-center gap-2">
                            <span class="w-2 h-2 bg-green-600 rounded-full"></span> Daftar Projek Global
                        </h3>
                    </div>
                    
                    <div class="space-y-3 mb-6">
                        <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-3">
                            <p id="projFormTitle" class="text-[9px] font-extrabold text-slate-400 uppercase tracking-widest">Tambah Projek Baru</p>
                            <input type="text" id="nP" placeholder="NAMA PROJEK BARU..." class="w-full p-3 border rounded-xl text-sm outline-none bg-white uppercase font-bold border-slate-200">
                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <label class="text-[8px] font-bold text-slate-400 uppercase ml-1">Mulai</label>
                                    <input type="date" id="nPStart" class="w-full p-2.5 border rounded-xl text-xs bg-white outline-none">
                                </div>
                                <div>
                                    <label class="text-[8px] font-bold text-slate-400 uppercase ml-1">Deadline</label>
                                    <input type="date" id="nPEnd" class="w-full p-2.5 border rounded-xl text-xs bg-white outline-none">
                                </div>
                            </div>
                            <div class="flex gap-2">
                                <button id="btnCancelEditProj" onclick="resetProjectForm()" class="hidden flex-1 bg-slate-200 text-slate-600 font-bold py-3 rounded-xl text-[10px] uppercase tracking-widest">Batal</button>
                                <button id="btnAddNewProject" onclick="addNewProject()" class="flex-[2] bg-blue-600 text-white py-3 rounded-xl font-bold active:scale-95 text-xs uppercase tracking-widest shadow-lg shadow-blue-100">+ Tambahkan Projek</button>
                            </div>
                        </div>
                        <div class="relative">
                            <input type="text" id="searchProj" oninput="handleProjSearch()" placeholder="Cari nama projek..." class="w-full p-3 pl-10 border rounded-xl text-xs outline-none bg-white border-slate-200 shadow-sm">
                            <svg class="w-4 h-4 absolute left-3.5 top-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        </div>
                    </div>

                    <div id="projListSettings" class="space-y-4 mb-4"></div>
                    <div id="projPagination" class="flex justify-between items-center px-1"></div>
                </div>
            </section>

            <!-- VIEW: SETTINGS -->
            <section id="v_settings" class="hidden space-y-8 max-w-2xl mx-auto">
                <div class="card p-6 shadow-sm bg-slate-50/50 border-slate-100">
                    <h3 class="text-xs font-bold text-slate-800 uppercase mb-4 tracking-widest flex items-center gap-2">
                        <span class="w-2 h-2 bg-blue-600 rounded-full"></span> Manajemen Akun
                    </h3>
                    <div class="space-y-4 mb-8">
                        <div class="grid grid-cols-2 gap-2">
                            <input type="text" id="mU" placeholder="Username" class="p-3 border rounded-xl text-sm outline-none bg-white">
                            <input type="text" id="mP" placeholder="Password" class="p-3 border rounded-xl text-sm outline-none bg-white">
                        </div>
                        <select id="mR" class="w-full p-3 border rounded-xl text-sm outline-none">
                            <option value="USER">TIM (USER)</option>
                            <option value="ADMIN">ADMINISTRATOR</option>
                        </select>
                        <div class="flex gap-2">
                            <button id="btnCancelEdit" onclick="resetUserForm()" class="hidden flex-1 bg-slate-200 text-slate-600 font-bold py-3 rounded-xl text-[10px] uppercase tracking-widest">Batal</button>
                            <button id="btnSaveUser" onclick="saveUser()" class="flex-[2] bg-slate-900 text-white font-bold py-3 rounded-xl text-[10px] uppercase tracking-widest">Simpan Akun</button>
                        </div>
                    </div>
                    <div class="space-y-2 mb-4" id="userListSettings"></div>
                    <div id="userPagination" class="flex justify-between items-center px-1"></div>
                </div>
            </section>
        </main>
    </div>

    <!-- MODAL EDIT LOG -->
    <div id="modalEdit" class="hidden fixed inset-0 z-[100] modal-overlay flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md p-6 rounded-3xl shadow-2xl">
            <h3 class="text-xs font-bold text-slate-800 uppercase mb-4 tracking-widest">Edit Progres</h3>
            <div class="space-y-4">
                <input type="hidden" id="editLogId">
                <textarea id="editLogWork" rows="5" class="w-full p-4 border rounded-2xl bg-slate-50 outline-none text-sm"></textarea>
                <div class="flex gap-2">
                    <button onclick="closeEditModal()" class="flex-1 py-3 bg-slate-100 text-slate-500 rounded-xl font-bold text-xs uppercase">Batal</button>
                    <button onclick="confirmEditLog()" class="flex-1 py-3 bg-blue-600 text-white rounded-xl font-bold text-xs uppercase shadow-lg">Simpan Perubahan</button>
                </div>
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-8 py-4 rounded-2xl shadow-2xl opacity-0 z-[100] text-[10px] font-bold uppercase tracking-widest text-center"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, collection, onSnapshot, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD-wrKOTP046d3Ojr_pKPHEWWf7Kuk5Nco",
            authDomain: "workspace-tracker-b3f8a.firebaseapp.com",
            projectId: "workspace-tracker-b3f8a",
            storageBucket: "workspace-tracker-b3f8a.firebasestorage.app",
            messagingSenderId: "347113310211",
            appId: "1:347113310211:web:900680ab7b8456a0f66636",
            measurementId: "G-46YN28RC22"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "workspace-tracker-final-v2";

        let currentUser = null;
        let logsData = [];
        let usersData = [];
        let projectsData = [];
        let isEditingUser = false;
        let isEditingProject = false;
        let editingProjectOldName = "";

        const PROGRESS_TASKS = [
            { key: "drafting", label: "Drafting" },
            { key: "layouting", label: "Layouting" },
            { key: "moodboard", label: "Moodboard" },
            { key: "design_ars", label: "Design Arsitektur" },
            { key: "design_int", label: "Design Interior" },
            { key: "gambar_ars", label: "Gmbr Kerja ARS" },
            { key: "gambar_elk", label: "Gmbr Kerja ELK" },
            { key: "gambar_int", label: "Gmbr Kerja INT" }
        ];

        let usersCurrentPage = 1;
        const usersPerPage = 5;
        let projsCurrentPage = 1;
        const projsPerPage = 3;
        let projSearchQuery = "";

        const userColors = {
            'rakha': 'bg-blue-100 text-blue-700 border-blue-200',
            'deby': 'bg-purple-100 text-purple-700 border-purple-200',
            'edward': 'bg-green-100 text-green-700 border-green-200',
            'jerico': 'bg-orange-100 text-orange-700 border-orange-200',
            'justin': 'bg-rose-100 text-rose-700 border-rose-200',
            'admin': 'bg-slate-900 text-white border-slate-900'
        };

        const getUserColorClass = (username) => {
            const u = username.toLowerCase();
            return userColors[u] || 'bg-slate-100 text-slate-700 border-slate-200';
        };

        const init = async () => {
            try {
                await signInAnonymously(auth);
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        document.getElementById('statusDB').innerText = "✅ Cloud Connected";
                        document.getElementById('statusDB').classList.replace('text-slate-400', 'text-green-600');
                    }
                });
            } catch (e) {
                document.getElementById('statusDB').innerText = "⚠️ Connection Error";
            }
        };
        init();

        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnLogin');
            btn.disabled = true; btn.innerText = "MENGECEK...";
            const u = document.getElementById('u').value.trim().toLowerCase();
            const p = document.getElementById('p').value.trim();
            const userRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', u);
            const userSnap = await getDoc(userRef);
            if (userSnap.exists() && userSnap.data().password === p) {
                currentUser = { username: u, ...userSnap.data() };
                startApp();
            } else if (u === 'admin' && p === 'admin123') {
                currentUser = { username: 'admin', role: 'ADMIN' };
                await setDoc(userRef, { password: 'admin123', role: 'ADMIN' });
                startApp();
            } else {
                msg("❌ USERNAME/PASSWORD SALAH");
                btn.disabled = false; btn.innerText = "MASUK SEKARANG";
            }
        };

        async function startApp() {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            document.getElementById('uDisp').innerText = currentUser.username.toUpperCase();
            document.getElementById('rDisp').innerText = currentUser.role;
            document.getElementById('f_date').valueAsDate = new Date();
            if (currentUser.role === 'ADMIN') {
                document.getElementById('t_projek').classList.remove('hidden');
                document.getElementById('t_settings').classList.remove('hidden');
            } else {
                document.getElementById('flUser').classList.add('hidden');
            }
            listenUsers();
            listenProjects();
            listenLogs();
            tab('input');
        }

        function listenProjects() {
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'projects'), (snap) => {
                projectsData = snap.docs.map(d => ({ name: d.id, ...d.data() }));
                renderProjectList();
                renderInputDropdowns();
                renderSidebarDeadlines();
                checkDeadlines();
            });
        }

        function calculateProgress(tasks = {}) {
            const completed = PROGRESS_TASKS.filter(t => tasks[t.key]).length;
            return (completed / PROGRESS_TASKS.length) * 100;
        }

        function renderInputDropdowns() {
            const fP = document.getElementById('f_proj');
            const flP = document.getElementById('flProj');
            if(!fP || !flP) return;
            const currentFpVal = fP.value;
            const currentFlpVal = flP.value;
            fP.innerHTML = '<option value="" disabled selected>-- Pilih Projek --</option>';
            flP.innerHTML = '<option value="ALL">SEMUA PROJEK</option>';
            projectsData.sort((a,b) => a.name.localeCompare(b.name)).forEach(proj => {
                const assignedUsers = proj.assignedUsers || [];
                if (currentUser.role === 'ADMIN' || assignedUsers.includes(currentUser.username)) {
                    fP.add(new Option(proj.name, proj.name));
                    flP.add(new Option(proj.name, proj.name));
                }
            });
            if(currentFpVal) fP.value = currentFpVal;
            if(currentFlpVal) flP.value = currentFlpVal;
        }

        window.renderSidebarDeadlines = () => {
            const sideList = document.getElementById('sideProjList');
            if(!sideList) return;
            
            // Filter and Sort: Projects assigned to user, Finished projects go to bottom
            const userProjects = projectsData.filter(proj => {
                const assigned = proj.assignedUsers || [];
                return currentUser.role === 'ADMIN' || assigned.includes(currentUser.username);
            }).sort((a, b) => {
                if (a.isFinished === b.isFinished) return a.name.localeCompare(b.name);
                return a.isFinished ? 1 : -1;
            });

            sideList.innerHTML = userProjects.length ? '' : '<p class="text-[9px] text-slate-400 italic py-2 text-center">Belum ada projek aktif</p>';
            
            userProjects.forEach(proj => {

            let alertCount = 0; let html = '';
            projectsData.forEach(proj => {
                if (proj.isFinished) return; // Don't show deadline alerts for finished projects
                const assigned = proj.assignedUsers || [];
                if ((currentUser.role === 'ADMIN' || assigned.includes(currentUser.username)) && proj.endDate) {
                    const end = new Date(proj.endDate); end.setHours(0,0,0,0);
                    const diffDays = Math.ceil((end - today) / (1000 * 60 * 60 * 24));
                    let alertMsg = '', bgColor = '';

                    else if (diffDays === 3) { alertMsg = 'Deadline 3 hari lagi!'; bgColor = 'bg-orange-50 border-orange-200 text-orange-600'; } 
                    else if (diffDays === 7) { alertMsg = 'Deadline 1 minggu lagi.'; bgColor = 'bg-blue-50 border-blue-200 text-blue-600'; }

            const newName = document.getElementById('nP').value.toUpperCase().trim();
            const start = document.getElementById('nPStart').value;
            const end = document.getElementById('nPEnd').value;
            if(!newName) return msg("NAMA PROJEK WAJIB DIISI!");
            if (isEditingProject) {
                const oldName = editingProjectOldName;
                if (newName !== oldName) {
                    const proj = projectsData.find(p => p.name === oldName);
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'projects', newName), { created: true, assignedUsers: proj.assignedUsers || [], startDate: start, endDate: end, tasks: proj.tasks || {}, notes: proj.notes || "", isFinished: proj.isFinished || false });
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'projects', oldName));
                    for (const l of logsData.filter(l => l.project_name === oldName)) { await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'logs', l.id), { project_name: newName }); }
                } else { await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'projects', oldName), { startDate: start, endDate: end }); }
                msg("✅ PROJEK DIPERBARUI");
            } else {
                if (projectsData.some(p => p.name === newName)) return msg("NAMA PROJEK SUDAH ADA!");
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'projects', newName), { created: true, assignedUsers: [], startDate: start, endDate: end, tasks: {}, notes: "", isFinished: false });
                msg("✅ PROJEK DITAMBAHKAN");
            }
            resetProjectForm();
        };

        window.resetProjectForm = () => {
            isEditingProject = false; editingProjectOldName = "";
            document.getElementById('nP').value = ''; document.getElementById('nPStart').value = ''; document.getElementById('nPEnd').value = '';
            document.getElementById('btnAddNewProject').innerText = "+ Tambahkan Projek"; document.getElementById('btnCancelEditProj').classList.add('hidden');
            document.getElementById('projFormTitle').innerText = "Tambah Projek Baru";
        };

        window.editProjectPrompt = (name, start, end) => {
            isEditingProject = true; editingProjectOldName = name;
            document.getElementById('nP').value = name; document.getElementById('nPStart').value = start || ''; document.getElementById('nPEnd').value = end || '';
            document.getElementById('btnAddNewProject').innerText = "Update Projek"; document.getElementById('btnCancelEditProj').classList.remove('hidden');
            document.getElementById('projFormTitle').innerText = "Edit Projek: " + name;
        };

        window.deleteProject = async (name) => {
            if(confirm(`Hapus projek ${name}?`)) { await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'projects', name)); msg("PROJEK DIHAPUS"); }
        };

        window.addUserToProject = async (projectName) => {
            const userId = document.getElementById(`selAddUser_${projectName.replace(/\s+/g, '_')}`).value;
            if(!userId) return msg("PILIH ANGGOTA TIM!");
            const project = projectsData.find(p => p.name === projectName);
            let updatedUsers = project.assignedUsers || []; if (!updatedUsers.includes(userId)) updatedUsers.push(userId);
            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'projects', projectName), { assignedUsers: updatedUsers });
            msg(`UPDATE TIM ${projectName}`);
        };

        window.toggleUserAssignment = async (projectName, userId, isAdding) => {
            const project = projectsData.find(p => p.name === projectName);
            let updatedUsers = (project.assignedUsers || []).filter(uid => uid !== userId);
            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'projects', projectName), { assignedUsers: updatedUsers });
            msg(`UPDATE TIM ${projectName}`);
        };

        window.deleteLog = async (id) => { if(confirm("Hapus laporan progres ini?")) { await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'logs', id)); msg("LAPORAN DIHAPUS"); } };
        window.editLogPrompt = (id, work) => { document.getElementById('editLogId').value = id; document.getElementById('editLogWork').value = work; document.getElementById('modalEdit').classList.remove('hidden'); };
        window.confirmEditLog = async () => { const id = document.getElementById('editLogId').value; const work = document.getElementById('editLogWork').value; await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'logs', id), { pekerjaan: work }); closeEditModal(); msg("✅ PROGRES DIPERBARUI"); };
        window.closeEditModal = () => document.getElementById('modalEdit').classList.add('hidden');

        window.tab = (t) => {
            ['input','logs','projek','settings'].forEach(k => {
                const view = document.getElementById('v_'+k); const btn = document.getElementById('t_'+k);
                if(view) view.classList.toggle('hidden', k !== t);
                if(btn) { btn.classList.toggle('tab-active', k === t); btn.classList.toggle('text-slate-400', k !== t); if(k === t) btn.classList.add('text-blue-600'); }
            });
            if(t === 'logs') renderLogs();
        };

        window.msg = (m) => { const t = document.getElementById('toast'); t.innerText = m; t.style.opacity = "1"; setTimeout(() => t.style.opacity = "0", 3000); };

        window.toggleAccordion = toggleAccordion; window.saveProjectNote = saveProjectNote; window.toggleTask = toggleTask; window.toggleNotifPanel = toggleNotifPanel; window.handleProjSearch = handleProjSearch;
        window.changeProjPage = changeProjPage; window.renderUserList = renderUserList; window.changeUserPage = changeUserPage; window.renderLogs = renderLogs;
        window.saveUser = saveUser; window.resetUserForm = resetUserForm; window.editUserPrompt = editUserPrompt; window.deleteUser = deleteUser;
        window.addNewProject = addNewProject; window.resetProjectForm = resetProjectForm; window.editProjectPrompt = editProjectPrompt; window.deleteProject = deleteProject;
        window.addUserToProject = addUserToProject; window.toggleUserAssignment = toggleUserAssignment; window.deleteLog = deleteLog; window.editLogPrompt = editLogPrompt;
        window.confirmEditLog = confirmEditLog; window.closeEditModal = closeEditModal; window.tab = tab; window.toggleFinishProject = toggleFinishProject;
    </script>
</body>
</html>
